apis:
- name: Jasper PIM API (Venzee)
  description: >-
    RESTful API for the Venzee / Jasper PIM platform. Manage products,
    variants, categories, brands, attributes and options, channel-specific
    pricing and inventory, and digital assets; subscribe to webhooks; read the
    changelog event feed for incremental syncs; and run asynchronous export
    jobs. Authentication is a Bearer token issued and rotated by an account
    representative. The production base URL is tenant-scoped as
    https://{hash}.{region}.jasperpim.com/api/v1 (region is corsair or ans).
  humanURL: https://apidocs.jasperpim.com/
